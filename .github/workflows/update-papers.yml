name: Update paper radar

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch latest arXiv metadata
        run: python scripts/update_papers.py
      - name: Commit changed metadata
        run: |
          if git diff --quiet -- data/papers.js; then
            echo "No paper metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.js
          git commit -m "Update latest paper metadata"
          git push
